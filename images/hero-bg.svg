<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08213f"/>
      <stop offset="55%" stop-color="#0d3b74"/>
      <stop offset="100%" stop-color="#1c6fb0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fa9dc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3fa9dc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- soft road / diagnostic sweep lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none">
    <path d="M-100 850 C 300 700, 700 950, 1700 650"/>
    <path d="M-100 920 C 350 780, 750 1000, 1700 720"/>
    <path d="M-100 760 C 300 640, 800 820, 1700 540"/>
  </g>

  <!-- blueprint grid, top-right -->
  <g stroke="#ffffff" stroke-opacity="0.06">
    <g id="vlines"></g>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <line x1="900" y1="0" x2="900" y2="1000"/>
    <line x1="1000" y1="0" x2="1000" y2="1000"/>
    <line x1="1100" y1="0" x2="1100" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
    <line x1="1300" y1="0" x2="1300" y2="1000"/>
    <line x1="1400" y1="0" x2="1400" y2="1000"/>
    <line x1="1500" y1="0" x2="1500" y2="1000"/>
    <line x1="0" y1="100" x2="1600" y2="100"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
  </g>

  <!-- abstract sedan silhouette, simplified geometric -->
  <g transform="translate(760,430)" opacity="0.16">
    <path d="M0 160
             L40 90
             C 70 40, 130 10, 210 10
             L 480 10
             C 560 10, 620 40, 650 90
             L 690 160
             L 900 170
             C 930 170, 950 190, 950 220
             L 950 260
             C 950 290, 930 310, 900 310
             L 20 310
             C -10 310, -30 290, -30 260
             L -30 220
             C -30 190, -10 170, 0 160 Z"
          fill="#ffffff"/>
    <circle cx="120" cy="320" r="70" fill="#08213f"/>
    <circle cx="120" cy="320" r="70" fill="none" stroke="#ffffff" stroke-width="6"/>
    <circle cx="760" cy="320" r="70" fill="#08213f"/>
    <circle cx="760" cy="320" r="70" fill="none" stroke="#ffffff" stroke-width="6"/>
  </g>

  <!-- glow accent -->
  <rect x="0" y="0" width="800" height="1000" fill="url(#glow)" opacity="0.5"/>

  <!-- circular scan rings, bottom-left, echoes inspection theme -->
  <g stroke="#3fa9dc" stroke-opacity="0.35" fill="none" stroke-width="2">
    <circle cx="180" cy="860" r="60"/>
    <circle cx="180" cy="860" r="110"/>
    <circle cx="180" cy="860" r="160"/>
  </g>
</svg>
